# CI (PLAN.md §7): GitHub-hosted arm64 runners only, one job per supported macOS
# (D2: 15, 26, 27); GitHub serves macOS 27 as the `xcode-27` image. Each job runs the
# package tests, builds the sandboxed app with ad-hoc signing ("Sign to Run Locally",
# no secrets), and runs the app's own smoke test on that macOS. The macOS 27 job also
# builds the HTML test and coverage report; pushes to main publish it to GitHub Pages.
#
# When GitHub announces the retirement of the macos-15 image, raise the minimum (D2)
# rather than adding a self-hosted machine.

name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: macOS ${{ matrix.macos }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - macos: "15"
            runner: macos-15
          - macos: "26"
            runner: macos-26
          - macos: "27"
            runner: xcode-27
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    env:
      APP: build/DerivedData/Build/Products/Debug/Twin Panes.app
    steps:
      - uses: actions/checkout@v7

      - name: Toolchain
        run: |
          sw_vers
          xcodebuild -version
          swift --version

      - name: Lint (swift-format)
        # Only on the newest image, so formatting rules come from one swift-format version.
        if: matrix.macos == '27'
        run: swift format lint --strict --recursive TwinPanesKit TwinPanes

      - name: Package tests
        # bash here means -o pipefail, so a failing swift test still fails the step.
        # macOS 27 also records coverage and JUnit XML for the test report.
        shell: bash
        run: |
          report=()
          if [ "${{ matrix.macos }}" = 27 ]; then
            mkdir -p build/report
            report=(--enable-code-coverage --xunit-output build/report/tests.xml)
          fi
          swift test --parallel "${report[@]}" --package-path TwinPanesKit 2>&1 | tee package-tests.log
          scripts/check-test-runs.sh package-tests.log

      - name: Test report
        # Before the Thread Sanitizer run, which rebuilds the test bundles llvm-cov reads.
        if: matrix.macos == '27' && !cancelled()
        run: |
          scripts/test-report.sh build/report build/report/site
          cat build/report/site/summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload test report
        if: matrix.macos == '27' && !cancelled()
        uses: actions/upload-artifact@v7
        with:
          name: test-report
          path: build/report/site

      - name: Upload test results page
        # Unzipped, so the run page links straight to the single HTML file.
        if: matrix.macos == '27' && !cancelled()
        uses: actions/upload-artifact@v7
        with:
          path: build/report/site/tests.html
          archive: false

      - name: Upload Pages site
        if: matrix.macos == '27' && !cancelled() && github.event_name == 'push'
        uses: actions/upload-pages-artifact@v5
        with:
          path: build/report/site

      - name: Package tests (Thread Sanitizer)
        # PLAN.md 7: ByteSource and the search run on several threads; one image is enough.
        if: matrix.macos == '27'
        shell: bash
        run: |
          swift test --sanitize=thread --package-path TwinPanesKit 2>&1 | tee tsan-tests.log
          scripts/check-test-runs.sh tsan-tests.log

      - name: Build app (sandboxed, ad-hoc signed)
        run: |
          xcodebuild -project TwinPanes.xcodeproj -scheme TwinPanes -configuration Debug \
            -destination 'platform=macOS,arch=arm64' -derivedDataPath build/DerivedData \
            CODE_SIGN_IDENTITY=- build

      - name: Check entitlements
        run: |
          codesign -d --entitlements :- "$APP" \
            > entitlements.plist
          for key in app-sandbox files.user-selected.read-write files.bookmarks.app-scope; do
            grep -q "com.apple.security.$key" entitlements.plist || { echo "missing $key"; exit 1; }
          done

      - name: Smoke test
        run: |
          "$APP/Contents/MacOS/Twin Panes" --smoke-test \
            | tee smoke.log
          grep -q "SMOKE OK" smoke.log

  report:
    # Publishes main's test report to GitHub Pages; the site is replaced on every push.
    name: Publish test report
    needs: test
    if: ${{ !cancelled() && github.event_name == 'push' }}
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - id: deploy
        uses: actions/deploy-pages@v5
